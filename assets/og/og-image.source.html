<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    background:#0a0a0a;
    font-family:"Liberation Sans", Arial, sans-serif;
    color:#f5f5f5; position:relative; overflow:hidden;
  }
  .glow {
    position:absolute; top:-180px; right:-160px;
    width:760px; height:760px; border-radius:50%;
    background:radial-gradient(circle, rgba(156,175,136,0.30) 0%, rgba(156,175,136,0.12) 40%, rgba(10,10,10,0) 70%);
  }
  .glow2 {
    position:absolute; bottom:-300px; left:-180px;
    width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle, rgba(156,175,136,0.13) 0%, rgba(10,10,10,0) 70%);
  }
  .rule { position:absolute; left:0; top:0; width:100%; height:6px; background:#9caf88; }
  .wrap {
    position:relative; height:100%; padding:78px 96px 68px;
    display:flex; flex-direction:column;
  }
  .row { display:flex; align-items:center; gap:32px; }
  .badge { width:100px; height:100px; flex:none; }
  .word { font-size:126px; font-weight:bold; letter-spacing:-0.055em; line-height:1; }
  .tagline {
    margin-top:auto; font-size:58px; line-height:1.15;
    letter-spacing:-0.025em; color:#f5f5f5; font-weight:bold;
  }
  .tagline b { color:#9caf88; font-weight:bold; }
  .sub {
    margin-top:24px; font-size:31px; line-height:1.45;
    letter-spacing:-0.005em; color:#a8a8a8; max-width:830px;
  }
  .foot {
    margin-top:auto; display:flex; align-items:center; gap:18px;
    font-size:27px; letter-spacing:0.06em; color:#8a8a8a;
  }
  .foot i { display:block; width:34px; height:3px; background:#9caf88; border-radius:2px; }
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div><div class="rule"></div>
  <div class="wrap">
    <div class="row">
      <svg class="badge" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#9caf88"/>
        <g stroke="#0a0a0a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M22 13 V51"/><path d="M45 22 L26 38"/><path d="M32 33 L46 51"/>
        </g>
      </svg>
      <div class="word">klyo</div>
    </div>
    <div class="tagline">Nutrition that <b>fits your day</b>.</div>
    <div class="sub">Log meals from a photo, track calories and macros, and get eating windows timed around your real calendar.</div>
    <div class="foot"><i></i>tryklyo.io</div>
  </div>
</body></html>
